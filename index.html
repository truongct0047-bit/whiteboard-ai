<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
main{max-width:700px;margin:auto;padding:28px 18px}
header{display:flex;justify-content:space-between;padding:12px 0 50px}
h1{font-size:42px;line-height:1.1;margin-bottom:12px}
p{color:#aaa;line-height:1.6}
.panel{background:#151515;border:1px solid #333;border-radius:18px;padding:20px;margin-top:28px}
label{display:block;margin:18px 0 8px;font-weight:bold}
textarea,select{width:100%;padding:14px;background:#080808;color:white;border:1px solid #444;border-radius:10px;font-size:16px}
textarea{height:120px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{width:100%;padding:16px;margin-top:24px;background:white;color:black;border:0;border-radius:12px;font-size:16px;font-weight:bold}
#status{display:none;margin-top:18px;padding:14px;background:#222;border-radius:10px;color:#ddd}
footer{text-align:center;color:#777;font-size:12px;margin:30px}
@media(max-width:450px){.grid{grid-template-columns:1fr}h1{font-size:36px}}


/* KHU VỰC HOẠT ẢNH VẼ TỪNG CHI TIẾT */
.drawing-animation{
  width:100%;
  aspect-ratio:16/9;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  margin-top:14px;
}

.drawing-animation svg{
  width:100%;
  height:100%;
  display:block;
}

/* Nét vẽ được JavaScript điều khiển */
.drawing-animation .draw-line{
  fill:none;
  stroke:#171717;
  stroke-width:4;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* Màu tô được JavaScript điều khiển */
.drawing-animation .color-fill{
  opacity:0;
}

  </style>

<main>
<header>
<strong>✳ WHITEBOARD AI</strong>

<h1>Biến ý tưởng<br>thành video.</h1>
<p>Tạo video kiến thức phong cách vẽ tay, có giọng đọc và phụ đề tiếng Việt.</p>

<section class="panel">
<form id="videoForm">
<label for="topic">Chủ đề video</label>
<textarea id="topic" required placeholder="Ví dụ: Lịch sử hình thành vũ trụ..."></textarea>

<div class="grid">
<div>
<label for="duration">Thời lượng</label>
<select id="duration">
<option>3 phút</option>
<option selected>5 phút</option>
<option>10 phút</option>
<option>30 phút</option>
</select>
</div>
<div>
<label for="format">Tỷ lệ video</label>

<option>16:9 YouTube</option>

<option>1:1 Vuông</option>

</div>
<div>

<option>Giọng nữ</option>
<option>Giọng nam</option>
</select>
</div>
<div>
<label for="style">Phong cách</label>
<select id="style">
  <option>Vẽ tay màu</option>
  <option>Phấn bảng màu</option>
</select>
</div>
</div>

<button type="submit">✦ TẠO VIDEO</button>
<div id="status" role="status"></div>
</form>
</section>
<footer>WHITEBOARD AI · CREATE YOUR IDEAS</footer>
</main>

<section class="panel" id="animation-lab">
  <h2>THỬ NGHIỆM VẼ TỪNG NÉT</h2>

<script>
const form = document.getElementById("videoForm");
const statusBox = document.getElementById("status");
const submitButton = form.querySelector("button");

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const topic = document.getElementById("topic").value.trim();
  if (!topic) return;

  statusBox.style.display = "block";
  statusBox.textContent = "Đang gửi chủ đề đến AI...";
  submitButton.disabled = true;

  try {
    const response = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        topic,
        duration: document.getElementById("duration").value,
        format: document.getElementById("format").value,
        voice: document.getElementById("voice").value,
        style: document.getElementById("style").value
      })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || "Có lỗi xảy ra.");
    }

    
let script = data.script;

if (typeof script === "string") {
  let cleaned = script.trim();

  // Loại bỏ dấu Markdown nếu AI trả về JSON trong khung mã
  cleaned = cleaned.replace(/^\s*```(?:json)?\s*/i, "");
  cleaned = cleaned.replace(/\s*```\s*$/, "");

  try {
    script = JSON.parse(cleaned);
  } catch (error) {
    const start = cleaned.indexOf("{");
    const end = cleaned.lastIndexOf("}");

    if (start !== -1 && end > start) {
      try {
        script = JSON.parse(cleaned.slice(start, end + 1));
      } catch (error2) {
        throw new Error("AI trả về JSON không hợp lệ.");
      }
    } else {
      throw new Error("AI trả về JSON không hợp lệ.");
    }
  }
}

if (!script || typeof script !== "object") {
  throw new Error("Không đọc được dữ liệu kịch bản.");
}

if (!Array.isArray(script.scenes) && Array.isArray(script.script?.scenes)) {
  script = script.script;
}

if (!Array.isArray(script.scenes)) {
  throw new Error("Kịch bản chưa có danh sách phân cảnh. Vui lòng tạo lại.");
}


    const output = document.createElement("div");
    output.id = "ai-result";
    output.style.cssText =
      "margin-top:18px;padding:16px;background:#151515;border:1px solid #333;border-radius:12px;white-space:pre-wrap;color:white";

    const title = document.createElement("h2");
    title.textContent = script.title || "Kịch bản video";
    output.appendChild(title);

    if (script.introduction) {
      const p = document.createElement("p");
      p.textContent = script.introduction;
      output.appendChild(p);
    }

    if (Array.isArray(script.scenes)) {
      script.scenes.forEach((scene, i) => {
        const heading = document.createElement("h3");
        heading.textContent = "Phân cảnh " + (scene.scene || i + 1);
        output.appendChild(heading);

        [
          ["Lời đọc", scene.narration],
          ["Hình vẽ", scene.drawing],
          ["Phụ đề", scene.subtitle]
        ].forEach(([label, value]) => {
          if (value) {
            const p = document.createElement("p");
            p.textContent = label + ": " + value;
            output.appendChild(p);
          }
        });
                const imageButton = document.createElement("button");
        imageButton.type = "button";
        imageButton.textContent = "✦ TẠO HÌNH MINH HỌA";
        imageButton.style.cssText =
          "background:white;color:black;width:100%;padding:14px;border:0;border-radius:10px;font-weight:bold;cursor:pointer";

        const imageBox = document.createElement("div");
        imageBox.style.cssText = "margin-top:12px";

        imageButton.onclick = async function() {
          imageButton.disabled = true;
          imageButton.textContent = "ĐANG VẼ HÌNH...";

          try {
            const response = await fetch("/api/image", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({
    description: scene.drawing || scene.narration || scene.subtitle,
    style: document.getElementById("style").value,
    aspectRatio: document.getElementById("format").value
  })
});

            const data = await response.json();

            if (!response.ok || !data.success) {
              throw new Error(data.error || "Không tạo được hình.");
            }

            imageBox.innerHTML = "";
            const img = document.createElement("img");
            img.src = data.image;
            img.alt = "Hình minh họa phân cảnh";
            const selectedFormat = document.getElementById("format").value;
const imageRatio = selectedFormat.startsWith("9:16") ? "9 / 16" :
  selectedFormat.startsWith("1:1") ? "1 / 1" : "16 / 9";

img.style.cssText =
  "display:block;width:100%;aspect-ratio:" + imageRatio +
  ";object-fit:contain;border-radius:10px;background:white";
            imageBox.appendChild(img);

            imageButton.textContent = "✦ TẠO LẠI HÌNH";
          } catch (error) {
            imageButton.textContent = "THỬ TẠO LẠI";
            alert(error.message);
          } finally {
            imageButton.disabled = false;
          }
        };

        output.appendChild(imageButton);
        output.appendChild(imageBox);
      });
    }

    if (script.conclusion) {
      const p = document.createElement("p");
      p.textContent = "Kết luận: " + script.conclusion;
      output.appendChild(p);
    }

    const old = document.getElementById("ai-result");
    if (old) old.remove();

    statusBox.textContent = "Đã tạo xong kịch bản AI.";
    statusBox.after(output);

  } catch (error) {
    statusBox.textContent = "Chưa tạo được kịch bản: " + error.message;
  } finally {
    submitButton.disabled = false;
  }
});

function createSvgElement(tag) {
  return document.createElementNS(
    "http://www.w3.org/2000/svg",
    tag
  );
}

function clearAnimation() {
  animationRun++;
  animationSvg.replaceChildren();
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function moveDrawingHand(hand, path, distance) {
  const point = path.getPointAtLength(distance);

  hand.setAttribute(
    "transform",
    `translate(${point.x} ${point.y})`
  );
}


async function playDrawing(data) {
  if (!data || !Array.isArray(data.groups)) return;

  clearAnimation();
  const runId = animationRun;

  animationStatus.textContent = "Bắt đầu vẽ: " + data.name;

  for (const group of data.groups) {
    if (runId !== animationRun) return;

    animationStatus.textContent = "Đang vẽ: " + group.name;

    const fillElements = [];

    // Tạo các vùng màu nhưng giữ ẩn.
    for (const fill of (group.fills || [])) {
      const path = createSvgElement("path");
      path.setAttribute("d", fill.d);
      path.setAttribute("fill", fill.color);
      path.setAttribute("opacity", "0");
      animationSvg.appendChild(path);
      fillElements.push(path);
    }

    // Vẽ tuần tự từng nét.
    for (const stroke of (group.strokes || [])) {
      if (runId !== animationRun) return;

      const path = createSvgElement("path");
      path.setAttribute("d", stroke);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", "#171717");
      path.setAttribute("stroke-width", "4");
      path.setAttribute("stroke-linecap", "round");
      path.setAttribute("stroke-linejoin", "round");

      animationSvg.appendChild(path);

      const length = path.getTotalLength();

      // Bỏ qua nét không có chiều dài.
      if (!Number.isFinite(length) || length < 0.1) {
        path.remove();
        continue;
      }

      path.style.strokeDasharray = length;
      path.style.strokeDashoffset = length;

      const duration = Math.max(
        350,
        Math.min(1600, length * 3)
      );

      
const hand = createDrawingHand();
animationSvg.appendChild(hand);

const startTime = performance.now();

await new Promise(resolve => {
  function drawFrame(now) {
    if (runId !== animationRun) {
      hand.remove();
      resolve();
      return;
    }

    const progress = Math.min(
      1,
      (now - startTime) / duration
    );

    const distance = length * progress;

    path.style.strokeDashoffset =
      String(length - distance);

    moveDrawingHand(hand, path, distance);

    if (progress < 1) {
      requestAnimationFrame(drawFrame);
    } else {
      path.style.strokeDashoffset = "0";
      hand.remove();
      resolve();
    }
  }

  requestAnimationFrame(drawFrame);
});

if (runId !== animationRun) return;
        }

    // Tô màu và chờ hoàn thành trước khi sang nhóm mới.
    for (const fillElement of fillElements) {
      if (runId !== animationRun) return;

      const colorAnimation = fillElement.animate(
        [
          { opacity: 0 },
          { opacity: 1 }
        ],
        {
          duration: 650,
          easing: "ease",
          fill: "forwards"
        }
      );

      await colorAnimation.finished.catch(() => {});

      if (runId !== animationRun) return;

      fillElement.setAttribute("opacity", "1");
    }

    await wait(250);
  }

  if (runId === animationRun) {
    animationStatus.textContent =
      "Đã hoàn thành: " + data.name;
  }
}
function selectDrawing(name) {
  currentDrawing = drawingSamples[name];
  playDrawing(currentDrawing);
}
document.getElementById("demoGrasshopper")

document.getElementById("demoPlant")

document.getElementById("playAnimation")
